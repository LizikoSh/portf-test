<script>
let images = [];
    let current = 0;

    function refreshGallery() {
      const items = Array.from(document.querySelectorAll('.gallery__item'))
        .filter(item => {
          const img = item.querySelector('img');
          return img && img.complete && img.naturalWidth > 0;
        });

      images = items.map(item => item.querySelector('img').src);

      items.forEach((item, index) => {
        item.onclick = () => openLightbox(index);
      });
    }

    function removeGalleryItem(mediaElement) {
      const item = mediaElement.closest('.gallery__item');

      if (item) {
        item.remove();
      }

      refreshGallery();
    }

    document.querySelectorAll('.gallery__item img').forEach(img => {
      img.addEventListener('load', refreshGallery);

      img.addEventListener('error', function () {
        removeGalleryItem(this);
      });

      if (img.complete && img.naturalWidth === 0) {
        removeGalleryItem(img);
      }
    });

    refreshGallery();

    function openLightbox(index) {
      refreshGallery();

      if (!images[index]) return;

      current = index;
      document.getElementById('lightbox-img').src = images[current];
      document.getElementById('lightbox').classList.add('active');
    }

    function closeLightbox(e) {
      if (!e || e.target === document.getElementById('lightbox')) {
        document.getElementById('lightbox').classList.remove('active');
      }
    }

    function changeImage(dir) {
      if (!images.length) return;

      current = (current + dir + images.length) % images.length;
      document.getElementById('lightbox-img').src = images[current];
    }

    document.addEventListener('keydown', e => {
      const lightbox = document.getElementById('lightbox');
      const isOpen = lightbox.classList.contains('active');

      if (!isOpen) return;

      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowRight') changeImage(1);
      if (e.key === 'ArrowLeft') changeImage(-1);
    });
</script>
<script>
    const year = document.getElementById('year');
    if (year) year.textContent = new Date().getFullYear();

    const revealItems = document.querySelectorAll('.portfolio-reveal');
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if ('IntersectionObserver' in window && !reducedMotion) {
      const observer = new IntersectionObserver((entries, currentObserver) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting) {
            entry.target.classList.add('is-visible');
            currentObserver.unobserve(entry.target);
          }
        });
      }, { threshold: 0.06 });
      revealItems.forEach((item) => observer.observe(item));
    } else {
      revealItems.forEach((item) => item.classList.add('is-visible'));
    }
  </script>
